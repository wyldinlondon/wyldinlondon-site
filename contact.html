<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Contact WYLD in London</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<div class="container">
<span class="logo">WYLD in London</span>

<nav>
<a href="index.html">Home</a>
<a href="contact.html">Contact</a>

<select id="languageSwitcher">
  <option value="en">English</option>
  <option value="it">Italiano</option>
  <option value="es">Español</option>
  <option value="fr">Français</option>
  <option value="de">Deutsch</option>
  <option value="zh">中文</option>
  <option value="ja">日本語</option>
</select>

</nav>
<div style="clear:both;"></div>
</div>
</header>

<section class="section visible">
<div class="container">

<h1 data-contact-title></h1>
<p data-contact-desc></p>

<form action="https://formsubmit.co/wyldinlondon.yt@post.com" method="POST">
<input type="hidden" name="_captcha" value="false">

<input type="text" name="name" placeholder="Your Name" required>
<input type="email" name="email" placeholder="Your Email" required>
<textarea name="message" rows="6" placeholder="Your Message" required></textarea>

<button type="submit" data-send-btn>Send Message</button>

</form>

</div>
</section>

<footer>
<div class="container">
© 2026 WYLD in London | WYLDinLondon.co.uk
</div>
</footer>

<script src="translations.js"></script>

</body>
</html>
