<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact | WYLD in London</title>
<link rel="stylesheet" href="style.css">
<script defer src="translations.js"></script>
</head>

<body>

<header>
  <a href="index.html" class="logo">
    <img src="logo.jpg" alt="WYLD in London Logo">
  </a>

  <nav>
    <a href="index.html" data-translate="home">Home</a>
    <a href="contact.html" data-translate="contact">Contact</a>
  </nav>

  <select id="languageSwitcher">
    <option value="en">English</option>
    <option value="it">Italian</option>
    <option value="es">Spanish</option>
    <option value="fr">French</option>
    <option value="de">German</option>
    <option value="zh">Chinese</option>
    <option value="ja">Japanese</option>
  </select>
</header>

<section class="contact-section">
  <h1 data-translate="contactTitle">Work With Us</h1>

  <form action="https://formsubmit.co/wyldinlondon.yt@post.com" method="POST">
    <input type="hidden" name="_captcha" value="false">

    <input type="text" name="name" placeholder="Your Name" required>
    <input type="email" name="email" placeholder="Your Email" required>
    <textarea name="message" placeholder="Your Message" required></textarea>

    <button type="submit">Send Message</button>
  </form>
</section>

<footer>
  © 2026 WYLD in London
</footer>

</body>
</html>
