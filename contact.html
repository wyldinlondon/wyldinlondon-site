<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Contact WYLD in London</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<div class="container">
<span class="logo">WYLD in London</span>
<nav>
<a href="index.html">Home</a>
<a href="pubs.html">Pubs</a>
<a href="cafes.html">Cafés</a>
<a href="about.html">About</a>
</nav>
<div style="clear:both;"></div>
</div>
</header>

<section class="section">
<div class="container">
<h2>Contact WYLD in London</h2>
<p>Own a pub or café? Want us to visit? Send us a message below.</p>

<form id="contactForm" action="https://formsubmit.co/wyldinlondon.yt@post.com" method="POST">
<input type="hidden" name="_subject" value="New Submission - WYLD in London">
<input type="hidden" name="_captcha" value="false">

<input type="text" name="name" placeholder="Your Name" required>
<input type="email" name="email" placeholder="Your Email" required>
<textarea name="message" rows="6" placeholder="Your Message" required></textarea>

<button type="submit" class="btn primary">Send Message</button>

<div class="success-message" id="successMessage">
Message sent successfully. We’ll be in touch soon.
</div>

</form>
</div>
</section>

<footer>
<div class="container">
<p>© 2026 WYLD in London</p>
</div>
</footer>

<script>
document.getElementById("contactForm").addEventListener("submit", function(){
  document.getElementById("successMessage").style.display = "block";
});
  
const sections = document.querySelectorAll(".section");
window.addEventListener("scroll", () => {
  sections.forEach(section => {
    const top = section.getBoundingClientRect().top;
    if(top < window.innerHeight - 100){
      section.classList.add("visible");
    }
  });
});
</script>

</body>
</html>
