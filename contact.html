<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Contact WYLD in London</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Inter',sans-serif;
  background:linear-gradient(180deg,#0f172a,#0b1120);
  color:#ffffff;
  min-height:100vh;
}

.container{
  width:90%;
  max-width:800px;
  margin:auto;
}

header{
  padding:25px 0;
  text-align:center;
  border-bottom:1px solid rgba(255,255,255,0.1);
}

.logo{
  font-size:22px;
  font-weight:700;
  color:#d4af37;
  letter-spacing:1px;
}

.section{
  padding:100px 0;
  text-align:center;
}

.section h1{
  font-size:36px;
  margin-bottom:20px;
  background:linear-gradient(90deg,#d4af37,#facc15);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.section p{
  color:#cbd5e1;
  margin-bottom:40px;
}

form{
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(10px);
  padding:40px;
  border-radius:20px;
  border:2px solid #d4af37;
  box-shadow:0 25px 60px rgba(0,0,0,0.7);
  text-align:left;
}

form input,
form textarea{
  width:100%;
  padding:16px;
  margin-bottom:20px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.3);
  background:rgba(255,255,255,0.1);
  color:#ffffff;
  font-size:15px;
}

form input::placeholder,
form textarea::placeholder{
  color:#e2e8f0;
}

form input:focus,
form textarea:focus{
  outline:none;
  border:1px solid #facc15;
  box-shadow:0 0 15px rgba(250,204,21,0.6);
}

button{
  width:100%;
  padding:16px;
  border:none;
  border-radius:12px;
  background:#d4af37;
  color:#000;
  font-weight:700;
  font-size:15px;
  cursor:pointer;
  transition:0.3s ease;
}

button:hover{
  background:#facc15;
  transform:translateY(-3px);
}

.success-message{
  display:none;
  margin-top:20px;
  padding:15px;
  border-radius:12px;
  background:#16a34a;
  color:#fff;
  text-align:center;
  font-weight:600;
}

footer{
  margin-top:80px;
  padding:40px 0;
  text-align:center;
  color:#94a3b8;
}
</style>
</head>

<body>

<header>
<div class="container">
<div class="logo">WYLD in London</div>
</div>
</header>

<section class="section">
<div class="container">

<h1>Contact WYLD in London</h1>
<p>Own a pub or café in London? Want us to visit? Interested in collaborating? Send us a message below.</p>

<form id="contactForm" action="https://formsubmit.co/wyldinlondon.yt@post.com" method="POST">
<input type="hidden" name="_subject" value="New Submission - WYLD in London">
<input type="hidden" name="_captcha" value="false">

<input type="text" name="name" placeholder="Your Name" required>
<input type="email" name="email" placeholder="Your Email" required>
<textarea name="message" rows="6" placeholder="Your Message" required></textarea>

<button type="submit">Send Message</button>

<div class="success-message" id="successMessage">
Message sent successfully. We’ll be in touch soon.
</div>

</form>

</div>
</section>

<footer>
<div class="container">
© 2026 WYLD in London | WYLDinLondon.co.uk
</div>
</footer>

<script>
document.getElementById("contactForm").addEventListener("submit", function(){
  document.getElementById("successMessage").style.display = "block";
});
</script>

</body>
</html>
